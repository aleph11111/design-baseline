document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

n>\n  <h1 style=\"font-size:38px;font-weight:600;letter-spacing:-0.02em;margin:6px 0 14px;line-height:1.05;\">CRM process coverage audit<\u002Fh1>\n  <p style=\"font-size:17px;line-height:1.55;color:hsl(215.4 16.3% 46.9%);max-width:820px;margin:0 0 10px;\">The question this answers: for the standard processes a small IT-service-provider CRM must support, <b>which are backed by a Design Baseline archetype, which are only partially backed, and which have no shape at all<\u002Fb> — and would therefore get hand-rolled differently each time unless defined. Verified against what each hk-crm page actually imports, not what the docs claim.<\u002Fp>\n  <div style=\"display:flex;gap:18px;flex-wrap:wrap;margin-top:16px;\">\n    <span style=\"display:inline-flex;align-items:center;gap:7px;font-size:13px;color:hsl(215.4 16.3% 40%);\"><span style=\"width:11px;height:11px;border-radius:3px;background:hsl(142 60% 40%);\"><\u002Fspan>Backed — archetype exists and is in use<\u002Fspan>\n    <span style=\"display:inline-flex;align-items:center;gap:7px;font-size:13px;color:hsl(215.4 16.3% 40%);\"><span style=\"width:11px;height:11px;border-radius:3px;background:hsl(35 90% 52%);\"><\u002Fspan>Partial — archetype exists, app bypasses or half-uses it<\u002Fspan>\n    <span style=\"display:inline-flex;align-items:center;gap:7px;font-size:13px;color:hsl(215.4 16.3% 40%);\"><span style=\"width:11px;height:11px;border-radius:3px;background:hsl(0 72% 55%);\"><\u002Fspan>Gap — no archetype; hand-rolled or missing<\u002Fspan>\n  <\u002Fdiv>\n\n  <!-- REGISTRY LAG callout -->\n  <div style=\"margin-top:24px;display:inline-flex;align-items:flex-start;gap:10px;padding:14px 18px;border-radius:10px;background:hsl(41 96% 92%);border:1px solid hsl(41 70% 78%);font-size:14px;line-height:1.5;color:hsl(30 60% 28%);max-width:820px;\">\n    <span style=\"font-weight:600;flex:0 0 auto;\">Finding 0 — registry lag.<\u002Fspan>\n    <span>The DS bundle ships primitives for <b>14 shapes<\u002Fb>; hk-crm's archetype MANIFEST registers only <b>10<\u002Fb>. Report (R), Feed-inbox (H), Import-wizard (W), and Calendar exist as finished primitives the project doesn't know it has — and two of them (H, W) were hand-rolled locally as a result. Sync the manifest before defining anything new.<\u002Fspan>\n  <\u002Fdiv>\n\n  <!-- ═══════════ COVERAGE MATRIX ═══════════ -->\n  <div style=\"height:1px;background:hsl(214.3 31.8% 91.4%);margin:44px 0 36px;\"><\u002Fdiv>\n  <div style=\"font-family:var(--font-mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:hsl(215.4 16.3% 46.9%);font-weight:600;margin-bottom:6px;\">01 — Coverage matrix<\u002Fdiv>\n  <h2 style=\"font-size:26px;font-weight:600;letter-spacing:-0.01em;margin:0 0 20px;\">Standard CRM processes vs. the baseline<\u002Fh2>\n\n  <div style=\"border:1px solid hsl(214.3 31.8% 91.4%);border-radius:12px;background:#fff;overflow:hidden;\">\n    <div style=\"display:grid;grid-template-columns:16px 210px 130px 1fr;gap:0;background:hsl(210 40% 98%);border-bottom:1px solid hsl(214.3 31.8% 91.4%);font-size:12px;font-weight:600;color:hsl(215.4 16.3% 46.9%);text-transform:uppercase;letter-spacing:.06em;\">\n      <div><\u002Fdiv><div style=\"padding:11px 12px;\">CRM process<\u002Fdiv><div style=\"padding:11px 10px;\">Archetype<\u002Fdiv><div style=\"padding:11px 14px;\">Evidence &amp; verdict<\u002Fdiv>\n    <\u002Fdiv>\n    <sc-for list=\"{{ matrix }}\" as=\"m\" hint-placeholder-count=\"14\">\n      <div style=\"display:grid;grid-template-columns:16px 210px 130px 1fr;border-bottom:1px solid hsl(214.3 31.8% 94%);font-size:13px;line-height:1.5;align-items:stretch;\">\n        <div style=\"{{ m.barStyle }}\"><\u002Fdiv>\n        <div style=\"padding:12px;font-weight:600;\">{{ m.process }}<\u002Fdiv>\n        <div style=\"padding:12px 10px;font-family:var(--font-mono);font-size:11.5px;color:hsl(215.4 16.3% 46.9%);\">{{ m.archetype }}<\u002Fdiv>\n        <div style=\"padding:12px 14px;color:hsl(215.4 16.3% 40%);\">{{ m.verdict }}<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n\n  <!-- ═══════════ GAP PROPOSALS ═══════════ -->\n  <div style=\"height:1px;background:hsl(214.3 31.8% 91.4%);margin:44px 0 36px;\"><\u002Fdiv>\n  <div style=\"font-family:var(--font-mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:hsl(215.4 16.3% 46.9%);font-weight:600;margin-bottom:6px;\">02 — The gaps, as archetype proposals<\u002Fdiv>\n  <h2 style=\"font-size:26px;font-weight:600;letter-spacing:-0.01em;margin:0 0 8px;\">What needs defining — and what doesn't yet<\u002Fh2>\n  <p style=\"font-size:15px;line-height:1.6;color:hsl(215.4 16.3% 46.9%);max-width:820px;margin:0 0 24px;\">Filtered through your own Rule of 2: a shape only becomes an archetype when two independent pages/projects need it. Some gaps below already pass; others should be written down as a <i>documented one-off<\u002Fi> now and promoted only when the second consumer appears.<\u002Fp>\n\n  <div style=\"display:flex;flex-direction:column;gap:16px;\">\n    <sc-for list=\"{{ proposals }}\" as=\"p\" hint-placeholder-count=\"5\">\n      <div style=\"border:1px solid hsl(214.3 31.8% 91.4%);border-radius:12px;background:#fff;padding:20px 22px;\">\n        <div style=\"display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px;\">\n          <span style=\"font-size:16px;font-weight:600;\">{{ p.name }}<\u002Fspan>\n          <span style=\"font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:3px 9px;border-radius:5px; {{ p.tagStyle }}\">{{ p.tag }}<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:20px;\">\n          <div>\n            <div style=\"font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:hsl(215.4 16.3% 46.9%);margin-bottom:5px;\">The shape &amp; today's evidence<\u002Fdiv>\n            <p style=\"font-size:13px;line-height:1.55;color:hsl(215.4 16.3% 40%);margin:0;\">{{ p.shape }}<\u002Fp>\n          <\u002Fdiv>\n          <div>\n            <div style=\"font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:hsl(215.4 16.3% 46.9%);margin-bottom:5px;\">Recommendation<\u002Fdiv>\n            <p style=\"font-size:13px;line-height:1.55;color:hsl(215.4 16.3% 40%);margin:0;\">{{ p.rec }}<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n\n  <!-- ═══════════ SEQUENCE ═══════════ -->\n  <div style=\"height:1px;background:hsl(214.3 31.8% 91.4%);margin:44px 0 36px;\"><\u002Fdiv>\n  <div style=\"font-family:var(--font-mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:hsl(215.4 16.3% 46.9%);font-weight:600;margin-bottom:6px;\">03 — Order of work<\u002Fdiv>\n  <h2 style=\"font-size:26px;font-weight:600;letter-spacing:-0.01em;margin:0 0 20px;\">Cheapest coverage first<\u002Fh2>\n  <div style=\"display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;\">\n    <div style=\"border:1px solid hsl(142 45% 78%);border-radius:12px;background:hsl(142 60% 98%);padding:20px;\">\n      <div style=\"font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:hsl(142 55% 30%);margin-bottom:10px;\">1 · Adopt what exists (days)<\u002Fdiv>\n      <ul style=\"font-size:13px;line-height:1.7;color:hsl(215.4 16.3% 40%);margin:0;padding-left:18px;\">\n        <li>Sync MANIFEST: register R, H, W, Calendar<\u002Fli>\n        <li>Activity page → <b>FeedShell/FeedItem<\u002Fb><\u002Fli>\n        <li>Settings/import → <b>WizardShell<\u002Fb><\u002Fli>\n        <li>Tasks → <b>GroupedListShell<\u002Fb> + DS Table<\u002Fli>\n      <\u002Ful>\n    <\u002Fdiv>\n    <div style=\"border:1px solid hsl(41 70% 80%);border-radius:12px;background:hsl(41 96% 96%);padding:20px;\">\n      <div style=\"font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:hsl(30 60% 34%);margin-bottom:10px;\">2 · Define the proven shapes (1–2 wks)<\u002Fdiv>\n      <ul style=\"font-size:13px;line-height:1.7;color:hsl(215.4 16.3% 40%);margin:0;padding-left:18px;\">\n        <li>Command palette spec (passes Rule of 2)<\u002Fli>\n        <li>Line-item editor spec (quoting is core CRM)<\u002Fli>\n        <li>Status-transition control spec<\u002Fli>\n        <li>Bulk-select: promote from D2 into A<\u002Fli>\n      <\u002Ful>\n    <\u002Fdiv>\n    <div style=\"border:1px solid hsl(214.3 31.8% 88%);border-radius:12px;background:#fff;padding:20px;\">\n      <div style=\"font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:hsl(215.4 16.3% 46.9%);margin-bottom:10px;\">3 · Document as one-offs, promote later<\u002Fdiv>\n      <ul style=\"font-size:13px;line-height:1.7;color:hsl(215.4 16.3% 40%);margin:0;padding-left:18px;\">\n        <li>Entity timeline (H adapter inside C)<\u002Fli>\n        <li>Merge / dedupe compare view<\u002Fli>\n        <li>Notification center<\u002Fli>\n        <li>Calendar page (primitive ready when needed)<\u002Fli>\n      <\u002Ful>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"margin-top:36px;padding-top:24px;border-top:1px solid hsl(214.3 31.8% 91.4%);font-size:13px;color:hsl(215.4 16.3% 46.9%);line-height:1.6;\">\n    Evidence: hk-crm route tree + per-page shell imports (grep-verified), archetype MANIFEST.json v1 (10 entries), DS bundle component groups (14 shapes), command-palette.tsx, positions-editor/, stage-controls.tsx, SettingsTableShell bulk API. Companion docs: <a href=\"360 Audit.dc.html\" style=\"color:hsl(187 100% 25%);\">360° audit<\u002Fa> · <a href=\"Flow Consistency Audit.dc.html\" style=\"color:hsl(187 100% 25%);\">flow audit<\u002Fa>.\n  <\u002Fdiv>\n\n<\u002Fdiv>\n\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{\n  &quot;$preview&quot;: { &quot;width&quot;: 1160, &quot;height&quot;: 1100 }\n}\">\nclass Component extends DCLogic {\n  renderVals() {\n    const bar = {\n      ok: 'background:hsl(142 60% 40%);',\n      part: 'background:hsl(35 90% 52%);',\n      gap: 'background:hsl(0 72% 55%);',\n    };\n    const tag = {\n      ready: 'background:hsl(142 60% 94%);color:hsl(142 55% 28%);border:1px solid hsl(142 45% 80%);',\n      define: 'background:hsl(41 96% 90%);color:hsl(30 60% 34%);border:1px solid hsl(41 70% 78%);',\n      later: 'background:hsl(210 40% 94%);color:hsl(215.4 16.3% 40%);border:1px solid hsl(214.3 31.8% 88%);',\n    };\n    return {\n      matrix: [\n        { process: 'Lead capture & records', archetype: 'A + J', barStyle: bar.part, verdict: 'Shapes exist and are used — but create/edit bypasses J for full-page routes (the flow-audit finding). Backed once Step 4 of IMPLEMENTATION.md lands.' },\n        { process: 'Account / company 360°', archetype: 'C', barStyle: bar.ok, verdict: 'DetailOverviewShell + Command Rail on /companies/[id] with tabbed sub-collections. The strongest page in the app; C is at v2.13 because of it.' },\n        { process: 'Pipeline management', archetype: 'P', barStyle: bar.ok, verdict: 'opportunities-kanban-client imports BoardShell/BoardColumn/BoardCard. On-shell.' },\n        { process: 'Quoting / offers (Angebote)', archetype: '—', barStyle: bar.gap, verdict: 'positions-editor/ is a fully hand-rolled editable line-item table (add/remove rows, service combobox, totals). The DS only has the read-only ReportLineTable. Core CRM process with no archetype — highest-value gap.' },\n        { process: 'Stage / status transitions', archetype: '—', barStyle: bar.gap, verdict: 'stage-controls.tsx hand-rolls guarded stage moves (incl. the raw bg-red-50 lost-deal button). Every entity with a lifecycle will need this; no shape governs it.' },\n        { process: 'Activity logging & history', archetype: 'H (unused)', barStyle: bar.part, verdict: 'The DS ships FeedShell/FeedItem; the /activity page hand-rolls its own event list instead. Adopt, don\\u2019t define.' },\n        { process: 'Tasks & follow-ups', archetype: 'K (unused here)', barStyle: bar.part, verdict: 'tasks-list uses a raw <table> + hand-rolled tabs, while GroupedListShell (K, promoted FROM this repo) sits unused on this page.' },\n        { process: 'Reporting & KPIs', archetype: 'G + R', barStyle: bar.ok, verdict: '/reports imports DashboardShell/DashboardGrid. R (report document) available in the DS for formal/printable outputs when needed.' },\n        { process: 'Resource / service matrix', archetype: 'M', barStyle: bar.ok, verdict: 'MatrixGridShell in use for the service-assignment matrix; M is at v1.9 because of this project.' },\n        { process: 'Data import (CSV bootstrap)', archetype: 'W (unused)', barStyle: bar.part, verdict: 'settings/import is a hand-rolled multi-step mapper; WizardShell/WizardStepper exist in the DS unused. Adopt, don\\u2019t define.' },\n        { process: 'Global search & quick actions', archetype: '—', barStyle: bar.gap, verdict: 'command-palette.tsx is a good hand-rolled cmdk palette (entities, quick actions, deep links via ?edit=). No archetype defines result grouping, quick-action grammar, or keyboard contract.' },\n        { process: 'Bulk operations on lists', archetype: 'D2 only', barStyle: bar.gap, verdict: 'SettingsTableShell has a full bulk-select API (checkbox column, bulk bar, bulk delete); ListWithDetailShell (A) — where CRM bulk work actually happens — has none.' },\n        { process: 'Dedupe / merge records', archetype: '—', barStyle: bar.gap, verdict: 'Nothing in app or DS. Every CRM grows one; when it arrives it will be invented ad-hoc unless a compare-and-merge shape is at least sketched.' },\n        { process: 'Notifications / reminders', archetype: '—', barStyle: bar.gap, verdict: 'Only ephemeral toasts (sonner). No persistent notification center; H would be its natural base.' },\n        { process: 'Scheduling / calendar', archetype: 'Calendar (unused)', barStyle: bar.part, verdict: 'CalendarShell exists in the DS; no hk-crm page uses it yet. Covered the day it\\u2019s needed — just register it in the manifest.' },\n        { process: 'Settings & administration', archetype: 'F2 + D2 + J', barStyle: bar.ok, verdict: 'The reference implementation — the convention the rest of the app should converge to.' },\n      ],\n      proposals: [\n        {\n          name: 'Line-item editor (quote/offer composer)', tag: 'Define now', tagStyle: tag.define,\n          shape: 'An editable document table: rows = positions (service, qty, rate, line total), inline add/remove/reorder, a totals stack, draft/valid states. Exists once as positions-editor/ (with service-combobox). The DS\\u2019s ReportLineTable is its read-only sibling — the two should share row/figure grammar (mono tabular-nums, hairline dividers).',\n          rec: 'Write the spec now even at one consumer: quoting is a core CRM process and the shape is complex enough that a second hand-rolling would diverge badly. Pair it with R so a quote composes in the editor and prints via ReportShell.',\n        },\n        {\n          name: 'Command palette / global search', tag: 'Define now — passes Rule of 2', tagStyle: tag.define,\n          shape: 'Cmd-K palette: grouped entity results, per-entity quick actions, deep links (?edit=<id> is already a cross-page contract in services/service-assignments). Built once here on cmdk/Command; the DS ships Command primitives but no archetype for grouping, action grammar, or the deep-link convention.',\n          rec: 'Promote hk-crm\\u2019s implementation: spec the result-group order (recents \\u2192 entities \\u2192 actions \\u2192 admin), the quick-action verb set, and the ?edit deep-link contract. Every future baseline app gets search for free.',\n        },\n        {\n          name: 'Status-transition control', tag: 'Define now', tagStyle: tag.define,\n          shape: 'A guarded state-machine strip: current stage, legal next moves as buttons, destructive transitions (lost/cancelled) gated by confirm + reason. Exists once as stage-controls.tsx; leads/companies lifecycle stages and task states are second and third consumers waiting.',\n          rec: 'Small spec, big payoff: transition affordance placement (C-page header vs rail), destructive-transition treatment (currently a raw bg-red-50 button — already a lint catch), and where the reason/note is captured (J dialog).',\n        },\n        {\n          name: 'Bulk select for list-with-detail (A)', tag: 'Capability, not a new archetype', tagStyle: tag.ready,\n          shape: 'D2\\u2019s SettingsTableShell already has the whole API: bulkSelectable, selection state, bulk-action bar replacing the toolbar, bulk delete with confirm. A has nothing — yet bulk assign-owner / add-to-campaign / delete happens on core lists, not settings tables.',\n          rec: 'Lift the D2 bulk API into ListWithDetailShell unchanged (same prop names, same bar behavior). This is an amendment to A\\u2019s spec, not a new archetype — the pattern is already proven in-repo.',\n        },\n        {\n          name: 'Entity timeline · Merge/dedupe · Notification center', tag: 'Document as one-offs, promote later', tagStyle: tag.later,\n          shape: 'Timeline: an H-adapter section inside C pages (company activity tab) — mostly composition, little new. Merge: a two-column compare-and-pick dialog; no consumer yet. Notifications: a persistent H-variant panel; no consumer yet.',\n          rec: 'Don\\u2019t spec ahead of need (your own Rule of 2). Instead add one line each to SURFACES.md naming the intended base (H inside C; J-style compare dialog; H panel) so that when the need arrives, the first implementation starts from the right shape instead of a blank file.',\n        },\n      ],\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
