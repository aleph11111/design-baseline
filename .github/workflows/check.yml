# PR gate: auto-merge waits on this job (register `check` as a required status on main).
name: check

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth 0: scripts/verify-package-version.mjs reads origin/main:package.json
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run verify:exports
      # every kind:page archetype at the device triad, in the runner's preinstalled Chrome
      - run: npm run check:viewports
        env:
          CHROME_PATH: /usr/bin/google-chrome

  # Pixel baselines (tests/screenshots/), compared inside the same pinned image
  # `npm run screenshots` uses locally — PLAYWRIGHT_IMAGE in src/testing/docker.mjs
  # (src/testing/docker.test.ts fails if this tag drifts from it).
  screenshots:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: npm ci
      - run: npm run gallery:build
      - run: npx playwright test
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: screenshot-diffs
          path: |
            playwright-report/
            test-results/
          retention-days: 7
