# Tags every package.json "version" bump on main as v<version> (docs/PACKAGE.md §1).
# Idempotent: an unchanged version or an existing tag is a no-op; tags are never moved.
name: tag-version

on:
  push:
    branches: [main]
    paths: [package.json]

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create v<version> tag if missing
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          tag="v$version"
          # Compare against the pre-push tip, not HEAD^: one push can carry several commits.
          prev=$(git show "${{ github.event.before }}:package.json" 2>/dev/null | node -p "JSON.parse(require('fs').readFileSync(0)).version" 2>/dev/null || true)
          if [ "$prev" = "$version" ]; then
            echo "version unchanged ($version) — no tag"; exit 0
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "$tag already exists — leaving it unchanged"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "$tag" "$GITHUB_SHA"
          git push origin "refs/tags/$tag"
          echo "created $tag on $GITHUB_SHA"
